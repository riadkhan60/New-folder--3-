<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />

    <title>Noctiluca Deep Expeditions</title>
    <meta
      name="description"
      content="Noctiluca runs crewed submersible dives from Guam to the floor of the Challenger Deep, 10,935 metres below the Pacific."
    />
    <meta name="theme-color" content="#0e6f86" />
    <meta property="og:title" content="Noctiluca Deep Expeditions" />

    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <noscript>
      <style>
        .loader { display: none !important; }
        html.is-loading body { overflow: auto !important; }
      </style>
    </noscript>
    <script>
      /* Watchdog: if the page's JavaScript never starts (blocked, failed,
         unsupported), reveal the static page instead of a black screen. */
      setTimeout(function () {
        var h = document.documentElement
        if (!window.__noctilucaBooting && !h.classList.contains('is-ready')) {
          h.classList.remove('is-loading')
          h.classList.add('skip-intro')
        }
      }, 8000)
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
    />
