<div class="loader" aria-hidden="true">
  <script>
    /* Decide before first paint whether the intro will run, so ?skipintro and
       reduced-motion visitors never see the black overlay flash. main.js makes
       the same decision once modules load. */
    (function () {
      try {
        if (/[?&](skipintro|reduced)(=|&|$)/.test(location.search) ||
            location.hash.length > 1 ||
            window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('skip-intro')
        }
      } catch (e) {}
    })()
  </script>
  <style>
    /* Critical: cover the page from the first paint, before loader.css lands. */
    .loader { position: fixed; inset: 0; z-index: 100; }
    .loader__panel { position: absolute; inset: 0; background: #000; }
    .loader__frame, .loader__mark { opacity: 0; }
    /* a light breathes in the dark from the first paint, while fonts load */
    .loader__panel::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(38vmax 30vmax at 50% 50%, rgb(108 248 232 / 0.055), transparent 70%);
      opacity: var(--loader-bloom, 0);
    }
    .loader:not(.is-running) .loader__panel::before {
      animation: loader-pre 1.2s cubic-bezier(0.33, 0, 0.2, 1) 0.1s both;
    }
    @keyframes loader-pre { from { opacity: 0; } to { opacity: 0.75; } }
    html.skip-intro .loader,
    html.is-ready .loader:not(.is-exiting) { display: none; }
  </style>

  <div class="loader__panel">
    <div class="loader__frame">
      <div class="loader__top">

        <p class="loader__coords">

            <span class="loader__label">Life support nominal</span>
            <span class="loader__leader"></span>

          </li>
          <li class="loader__check">
            <svg class="loader__tick" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7.5" /><path d="M5.4 9.3l2.4 2.4 4.9-5.2" /></svg>
            <span class="loader__label">Ballast armed</span>

            <span class="loader__label">Lamps tested</span>

            <span class="loader__label">Released from MV Lantern</span>

        </div>
      </div>

      <div class="loader__progress"><span></span></div>
    </div>
  </div>
